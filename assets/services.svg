<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img"><style>text{font-family:'Courier New',Consolas,'Liberation Mono',monospace}.fade{opacity:0;animation:fade .9s ease forwards}@keyframes fade{to{opacity:1}}.blink{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
