le="animation-delay:1.4s"><text x="637" y="66" font-size="12" fill="#8A8A8A" letter-spacing="2">03</text><text x="637" y="110" font-size="16" font-weight="bold" fill="#fff" letter-spacing="1">CONTENIDO VISUAL</text><rect x="637" y="124" width="30" height="2" fill="#fff"/><text x="637" y="152" font-size="12.5" fill="#8A8A8A">Video corto, contenido</text><text x="637" y="172" font-size="12.5" fill="#8A8A8A">cinematográfico y narrativas</text><text x="637" y="192" font-size="12.5" fill="#8A8A8A">visuales para plataformas.</text><circle cx="837" cy="74" r="17" fill="none" stroke="#fff" stroke-width="1.5"/><polygon class="pulse" points="833,67 833,81 845,74" fill="#fff"/></g></svg>